<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: bisque;

        }
        h1{
            text-align: center;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
    <form>
   <h1>Registration form</h1> 
   <label>Enter your Name</label>
   <input type="text" name="uname">
   <br><br>
   <label>Enter Fname</label>
   <input type="text" name="fname">
   <br><br>
   <label> Enter mName</label>
   <input type="text" name="mName">
   <br><br>
   <label> Enter your phone number</label>
   <input type="number" name="phone number">
   <br><br>
   <label> Enter your email</label>
   <input type="email" name="youremail">
   <br><br>
   <label>Enter Address</label>
   <textarea name="Address"></textarea>
   <br><br>
   <label>Enter your gender:</label>
   <input type="radio" name="gender" value="male">Male
   <input type="radio" name="gender" value="female">female
   <input type="radio" name="gender" value="other">other
   <br><br>
   <label>Enter your hobbies:</label>
   <input type="checkbox" name="hobbies" value="reading">reading
   <input type="checkbox" name="hobbies" value="writing">writing
   <input type="checkbox" name="hobbies" value="swimming">Swimming
   <br><br>
<label>Select your country</label>
<select name="Country">
<option value="india">INDIA</option>
<option value="usa">USA</option>
<option value="uk">UK</option>
<option value="australia">AUSTRALIA</option>
</select>
<br><br>
<label>Select your state</label>
<select name="state">
    <option value="up">UTTAR PRADESH</option>
<option value="od">ODISHA</option>
<option value="ap">ANDHRA PRADESH</option>
</select>
<br><br>
<label style="color: blueviolet;">Enter your password</label>
<input type="password" name="password">
<br><br>
<label style="font-family: 'Times New Roman', Times, serif; font: size 30px;;">Date of birth</label>
<input type="date" name="dob">
<br><br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</form>
